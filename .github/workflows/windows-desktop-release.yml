name: Windows POS release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag must match the stable version in desktop/package.json."
          }
      - run: npm ci
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run package:win
      - name: Publish installer and update metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $installer = "artifacts/desktop/Brothers-Outfit-POS-Setup-$version.exe"
          $assets = @($installer, "$installer.blockmap", 'artifacts/desktop/latest.yml')
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release asset $asset" }
          }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "Brothers Outfit POS $version" --generate-notes
